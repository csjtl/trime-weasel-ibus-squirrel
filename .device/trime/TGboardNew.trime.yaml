  back_style: "ic@arrow-left" # 左侧返回按钮样式

  # 左侧固定主按钮配置
  primary_button:
    size: [50, 124]      # 视图组件整体宽高 (支持: -1: 填充(matchParent), -2: 自适应(wrapContent))
    # 背景样式设置
    background:
      type: circle           # 高亮形状 (可选值: circle|rectangle)
      corner_radius: 10      # 圆角半径
      normal: 0x00        # 正常状态背景颜色
      highlight: hilited_candidate_button_color  # 高亮状态背景色
      vertical_inset: 4      # 垂直方向内缩量
      horizontal_inset: 4    # 水平方向内缩量
    # 前景内容设置
    foreground:
      style: "ic@dots_horizontal"         # 内置质感设计图标样式（以ic@开头）
      normal: candidate_text_color  # 正常状态前景色 (本地图片不允许着色)
      # highlight:        # 高亮状态前景色
      padding: 10            # 前景内容与背景边界的内边距
      # size: [120, 24]      # 视图控件宽高，非前景样式宽高
    # 按钮点击事件
    action: menu_keyboard
    long_press_action: Settings

  hide_button: &hide_button
    foreground:
      style: "ic@keyboard_close"
      font_size: *tbfs  # 按钮字体大小
      normal: candidate_text_color
    action: Hide

  punctuation_button: &punctuation_button
    foreground:
      style: "ic@emoticon"
      font_size: *tbfs  # 按钮字体大小
    # 前景样式可以为空，使用默认样式，按钮将显示为 action 的 label
    action: Keyboard_punctuation_mark

  clipboard_button: &clipboard_button
    foreground:
      style: "ic@clipboard"
      font_size: *tbfs  # 按钮字体大小
    action: clipboard_window

  redo_button: &redo_button
    foreground:
      style: "ic@redo"
      font_size: *tbfs  # 按钮字体大小
    action: redo

  edit_button: &edit_button
    foreground:
      style: "ic@cursor_text"
      font_size: *tbfs  # 按钮字体大小
    action: Keyboard_editor

  cursor_toolbar: &cursor_toolbar
    foreground:
      style: "ic@cursor_text"
      font_size: *tbfs  # 按钮字体大小
    action: cursor_toolbar

  undo_button: &undo_button
    foreground:
      style: "ic@undo"
      font_size: *tbfs  # 按钮字体大小
    action: undo

  ascii_mode_button: &ascii_mode_button
    foreground:
      option_styles: ["ic@ideogram_cjk", "ic@alphabetical_variant"] # 样式也可以为表，将根据 action 的 toggle 决定
      font_size: *tbfs  # 按钮字体大小
      #padding: 10
    action: Mode_switch

  full_shape_button: &full_shape_button
    foreground:
      option_styles: ["ic@moon_waxing_crescent", "ic@moon_full"]
      font_size: *tbfs  # 按钮字体大小
    action: Zenkaku_Hankaku

  # 右侧按钮列表（从右向左排列）
  buttons: [ *hide_button, *punctuation_button, *clipboard_button, *redo_button, *undo_button, *ascii_mode_button, *full_shape_button ]

