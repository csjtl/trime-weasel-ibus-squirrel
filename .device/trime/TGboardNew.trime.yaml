config_version: "3.0"
name: TGboard New
author: csjtl

var_key: #var_value
 #键盘布局
  1_01: &jpbj_sp 350 #竖屏键盘布局高度 400/350
  1_02: &jpbj_hp 300 #横屏键盘布局高度 350/250
  1_03: &h_gap 3 #键盘横缝大小
  1_04: &s_gap 3 #键盘竖缝大小
  1_05: &liquid_bar_size 22 #液体键盘固定按键大小，不起作用
  1_06: &keyb_pb 0 #底边缘距离(底部边缘被覆盖)
 #按键高度
  2_01: &keyb_h 160 #主键盘按键高度
  2_02: &keyb_end_h 170 #主键盘尾行按键高度
  2_03: &keyb_foot_h 140 #其它键盘尾行按键高度
  2_04: &keyb_nullline_h 1 #空行按键高度
  2_05: &keyb_gn_h 160 #功能键盘按键高度
  2_06: &keyb_liquid_w 100 #liquid按键宽度 100/82
 #符号位置
  3_01: &ksox_e 17 #字母上方为标点左移距离
  3_02: &ksoy_c -8 #字母上方为中文-上移距离
  3_03: &sts_c 13 #字母上方为中文-字体大小
  3_04: &main_kts 35 #主，数字键盘按键文字大小
  3_05: &sym_kts 25 #符号键盘按键文字大小
  3_06: &gnkey_t 30 #功能按键图标符号大小
  3_07: &gnkey_c 8 #逗号图标符号大小
  3_08: &gnkey_p 5 #句号图标符号大小
  3_09: &tbfs 22 #tool bar符号大小
 #键盘圆角
  4_01: &key_round 10 #按键圆角半径
  4_02: &window_round 0 #候选窗口圆角
  4_03: &enter_round 20 #回车键圆角

wb:
  #1: &main_kts_wb 25 #五笔键盘按键文字大小
  2: &ktc_wb 0xFFB0C6FF
  #3: &ksc_wb 0xFF000000
  3: &ksc_wb 0xFFFFFFFF
  4: &ktox_wb -9 # key_text_offset_x
  5: &ktoy_wb -25 #key_text_offset_y
  6: &khox_wb 0 # key_hint_offset_x
  7: &khoy_wb -21 # key_hint_offset_y

var_colors:
 #深色方案
  01_01: &dark_c01 0xFFC62828
  01_02: &dark_c02 0xFFE3E3E3
  01_03: &dark_c03 0xFF38393D
  01_04: &dark_c04 0xFF1F1F1F
  01_05: &dark_c05 0xFF444746
  01_06: &dark_c06 0xFF131313
  01_07: &dark_c07 0xFFA8C7FA
  01_08: &dark_c08 0xFF838383
  01_09: &dark_c09 0xFF062D6D
  01_10: &dark_c10 0xFF7B7B7B
 #明亮方案
  02_01: &light_c01 0xFF000000
  02_02: &light_c02 0xFF0B57CF
  02_03: &light_c03 0xFF1A1A1A
  02_04: &light_c04 0xFF1F1F1F
  02_05: &light_c05 0xFF23948e
  02_06: &light_c06 0xFF37474f
  02_07: &light_c07 0xFF5f6b73
  02_08: &light_c08 0xFFd3d7da
  02_09: &light_c09 0xFFDDE1E8
  02_10: &light_c10 0xFFE1E3E0
  02_11: &light_c11 0xFFeceff1
  02_12: &light_c12 0xFFEFF3FA
  02_13: &light_c13 0xFFEFF4FA
  02_14: &light_c14 0xFFff0000
  02_15: &light_c15 0xFFFFFFFF
 #纯黑方案
  03_01: &black_c01 0xFFD4D4D4 #浅灰色   按键文字/右上图标/shift点击文字色/长按文字颜色/功能按键文字/代码分隔符
  03_02: &black_c02 0xFF000000 #黑色     shift锁定背景色/点击按键背景色/编码背景色/键盘背景颜色
  03_03: &black_c03 0xFF3F4659 #深灰色   功能按键背景/回车背景颜色
  03_04: &black_c04 0xFF171717 #浅黑色   按键背景颜色
  03_05: &black_c05 0xFFB0C6FF #蓝色     未使用
  03_06: &black_c06 0xFF5D3F3A #棕色     未使用
 #Gboard red方案
  04_01: &red_tab 0xFFe2e4e5 #打字区背景
  04_02: &red_tat 0xFF161616 #打字区文字
  04_03: &red_mkb 0xFFc62828 #主键盘背景
  04_04: &red_mkt 0xFFffffff #主键盘文字/预览文字
  04_05: &red_mkkb 0xFFd04e4e #主键盘按键背景
  04_06: &red_fk 0xFFca3838 #功能键
  04_07: &red_ek 0xFFf44336 #回车键
  04_08: &red_apt 0xFFcd4343 #按下后文字
  04_09: &red_pb 0xFFb71c1c #预览背景
  04_10: &red_pk 0xFFec1310 #预览按键

 # 共用颜色
  #ubuntu颜色
  09_01: &ubuntu_o 0xFFe95420 #橙色
  09_02: &ubuntu_w 0xFFffffff #白色
  09_03: &ubuntu_b 0xFF000000 #黑色
  #验证用颜色
  10_01: &error_r 0xFFff0000 #红色
  10_02: &error_g 0xFF00ff00 #绿色
  10_03: &error_b 0xFF0000ff #蓝色

style:
 #功能开关++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
  auto_caps: false #自动句首大写:true|false
  #candidate_use_cursor: false #高亮候选项
  #horizontal: true #水平模式
  #keyboards: [.default, five_strokes, mini, letter, us_intl, number, edit_kb]
  #proximity_correction: true #按键纠错
  #background_folder: #背景图保存在background目录下的哪个子目录
  reset_ascii_mode_on_focus_change: false #显示键盘时重置为中文状态flase记忆收起键盘时中英模式最后的状态，true不记忆最后的状态，预设键盘不指定模式时，默认为英文状态
  #latin_locale: en_US #西文语言
  #locale: zh_CN #缺省语言 zh_TW,zh_CN,zh_HK,""
  #speech_opencc_config: none #语音输入简繁转换
 #字体相关++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
  text_font: [latin.ttf] #编码字体
  #text_size: 18 #正在输入编码的区域字号
  comment_font: [comment.ttf] #编码提示字体
  comment_text_size: 15 #侯选区上部字体大小（状态开关上部， 侯选字上部编码提示）
  candidate_text_size: 30  #候选字号（状态栏/候选栏）
  label_font: [label.ttf] #编标签字体
  key_long_text_size: 16 #长标签字号
  symbol_font: [symbol.ttf, seguisym.ttf] #符号字体(包括特殊符号tab键)
  symbol_text_size: 15 #按键上方符号字号/助记字号
  candidate_font: #候选字体  # List
    #- PlangothicP1-Regular.otf
    #- PlangothicP2-Regular.otf
    #- SourceHanSansSC-Regular.otf
    - Plangothic.ttc
  #hanb_font: [MaYuan-Regular.otf] #候选字后备字体生僻字
  latin_font: [latin.ttf] #西文本体
  key_font: [symbol.ttf] #[symbol.ttf] #[seguisym.ttf] #键盘字体(包括特殊符号enter, 删除，液体键盘表情)
  key_text_size: 25 #按键字母字号
  popup_font: [symbol.ttf] #按键提示字体（按键弹出显示符号）
  popup_text_size: 33 #按键提示字号
  #long_text_font: [comment.ttf] #剪贴板板等可能包含大段文本使用的字体
 #界面风格++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
  #color_scheme: red #配色方案
  candidate_padding: 10  #候选项内边距（竖线间的距离）
  candidate_spacing: 1  #候选间距（字词间的竖线宽度）
  candidate_text_vertical_bias: 0.5 #候选文本垂直偏移位置（仅 overlay 模式使用，需要间隙空间足够，范围 0.0~1.0，0.0=top，0.5=center，1.0=bottom）
  candidate_view_height: 45 #候选区高度
  #comment_on_top: true #编码提示在上方或右侧
  comment_height: 12 #编码提示区高度（仅 top 模式约束高度，其余模式与 candidate_view_height 无区别）（区显，编码显示补全区）
  comment_position: top #编码提示布局位置：right / top / overlay
  comment_vertical_bias: -1.0 #编码提示垂直偏移位置（仅 overlay 模式使用，需要间隙空间足够，范围 0.0~1.0，0.0=top，0.5=center，1.0=bottom）
  horizontal_gap: *h_gap #键水平间距
  #background_dim_amount: 0.5
  #root_background: keyboard_back_color # 整个键盘区+候选栏的背景图/色
  #keyboard_padding: 0 #竖屏模式下，屏幕左右两侧与键盘的距离（曲面屏减少误触）
  #keyboard_padding_left: 0 #竖屏屏模式下，左手键盘布局，屏幕左侧与键盘的距离
  #keyboard_padding_right: 40 #竖屏屏模式下，左手键盘布局，屏幕右侧与键盘的距离
  keyboard_padding_bottom: *keyb_pb #竖屏模式下，屏幕下边缘与键盘的距离（避免误触发全面屏手势）
  #keyboard_padding_land: 60 #横屏模式下，屏幕左右两侧与键盘的距离（避免横屏按键过度拉伸变形）
  keyboard_padding_land_bottom: *keyb_pb #横屏模式下，屏幕下侧与键盘的距离
  key_height: *keyb_h #键高
  key_width: 10.0 #键宽，占屏幕宽的百分比
  label_text_size: *liquid_bar_size #标签字号
  keyboard_height: *jpbj_sp #锁定键盘高度，避免切换时键盘高度变化而造成闪烁
  keyboard_height_land: *jpbj_hp #锁定横屏下键盘高度，避免切换时键盘高度变化而造成闪烁
  popup_width: 50 #按键提示窗口宽度
  popup_height: 70 #按键提示窗口高度
  popup_bottom_margin: 110 #按键提示窗口相对按键底边距（高度）
  popup_key_height: 70 #按键提示窗口内键高度
  ###preview_offset: -100 #按键提示纵向偏移
  round_corner: *key_round #按键圆角半径
  shadow_radius: 0.0 #按键阴影半径
  #vertical_correction: -5
  vertical_gap: *s_gap #键盘行距
  #key_long_text_border: 1
  enter_label_mode: 2  #是否使用App提供的ActionLabel内容作为Enter键的文本（由于多数App没有适配ActionLable，实际影响不大）。0不使用，1只使用actionlabel，2优先使用，3当其他方式没有获得label时才读取actionlabel
  enter_labels:  # 定义Enter键的文本
    go: 前往
    done: 完成
    next: 下个
    pre:  上个
    search: "ic@magnify"
    send: 发送
    default: "ic@keyboard_return" #Enter   # 定义默认Enter键的文本

preedit:                  # 预编辑文本视图参数
  horizontal_padding: 8     # 横向内边距（整数）
#  alpha: 0.8                 # 透明度（0-1，浮点）
  top_end_radius: 4         # 末上端圆角（浮点）
  foreground:               # 前景样式
    font_size: 16             # 预编辑字体大小（浮点）

window:               # 候选窗口（悬浮窗）参数
  insets:               # 窗口内边距
    vertical: 4           # 纵向内边距（整数）
    horizontal: 4         # 横向内边距（整数）
  item_padding:         # 候选项内边距
#    vertical: 0           # 纵向内边距（整数）
    horizontal: 4         # 横向内边距（整数）
#  min_width: 0          # 最小宽度（整数）
#  corner_radius: 0      # 圆角半径（浮点）
#  border: 0             # 边框宽度（整数）
#  shadow: 0.0           # 阴影半径（浮点）
#  alpha: 1              # 透明度（0-1，浮点）
  foreground:           # 前景样式
    label_font_size: 20   # 序号字体大小（浮点）
    text_font_size: 20    # 文字字体大小（浮点）
    comment_font_size: 16  # 注释字体大小（浮点）

fallback_colors:
  candidate_text_color: text_color

preset_color_schemes: #配色方案
  dark:
    name: 深色  #方案名称
    author: csjtl #作者信息
    #light_scheme: light
    back_color: *dark_c04 #状态栏(候选区)/输入区光标（符号^）的背景
    border_color: *error_b #边框
    candidate_separator_color: *dark_c05 #候选区文字间分割线
    candidate_text_color: *dark_c02 #候选区文字
    comment_text_color: *dark_c02 #候选区文字上方的文字，符号，编码显示
    text_back_color: *dark_c04 #输入区底色
    text_color: *dark_c07 #输入区光标的符号（^）颜色
    label_color: *dark_c02 #输入区候选字词的序号数字标签
    hilited_back_color: *dark_c04 #输入区正在输入的编码区底色
    hilited_text_color: *dark_c07 #输入区正在输入的编码颜色
    hilited_candidate_back_color: *dark_c09 #输入区高亮候选词的底色和液体键盘标签背景色
    hilited_candidate_text_color: *dark_c02 #输入区高亮候选词文字颜色
    hilited_comment_text_color: *dark_c02 #输入区文字的符号，编码提示
    hilited_key_back_color: *dark_c04 #按住按键时按键的底色
    hilited_key_border_color: 0xffeceff1 #標明按鍵邊框
    hilited_key_symbol_color: *dark_c05 #点击按键时的符号
    hilited_key_text_color: *dark_c05 #点击按键时的文本
    hilited_off_key_back_color: *dark_c04 #高亮按键关闭状态背景（未知）所有功能键按住背景色
    hilited_off_key_border_color: 0xffeceff1 #標明按鍵關閉狀態邊框
    hilited_off_key_text_color: *dark_c05 #高亮按键关闭状态文本（未知）所有功能键按住文本色
    hilited_on_key_back_color: *dark_c04 #标明按键打开状态背景/Shift键单击大写转小写时按键背景色和候选词展开按钮单击时背景色
    hilited_on_key_border_color: 0xffeceff1 #標明按鍵打開狀態邊框
    hilited_on_key_text_color: *dark_c05 #标明按键打开状态文字/Shift键单击大写转小写时文字颜色
    key_back_color: *dark_c03 #非主键盘按键背景
    key_border_color: *error_b #按键边框
    key_text_color: *dark_c02 #非主键盘按键文本
    keyboard_back_color: *dark_c04 #主键盘背景
    key_symbol_color: *dark_c02 #键盘按键长按符号（按键主字母/文字上方）
    off_key_back_color: *dark_c05  #按键关闭状态背景（所有功能键背景色编辑键盘）
    off_key_border_color: 0xffeceff1 #按鍵關閉狀態邊框
    off_key_text_color: *dark_c02 #按键关闭状态文本（所有功能键背景色编辑键盘）
    on_key_back_color: *dark_c07 #按键打开状态背景/Shift键单击小写转大写后锁定大写时按键背景颜色
    on_key_border_color: 0xffeceff1 #按鍵打開狀態邊框
    on_key_text_color: *dark_c09 #按键打开状态文字/Shift键单击小写转大写后锁定大写时文字颜色
    preview_back_color: *dark_c05 #按键弹出显示背景/泡泡
    preview_text_color: *dark_c07 #按键弹出显示文本/泡泡
    shadow_color: *error_r #按键文字阴影
    key_fj_back_color: *dark_c10 #fj按键背景
    b_kg: *dark_c03 #空格键背景色
    t_kg: *dark_c02 #空格键文字颜色
    b_enter: *dark_c07 #回车键背景色
    t_enter: *dark_c09 #回车键文字颜色
    b_gn: *dark_c05 #功能键背景色
    t_gn: *dark_c02 #功能键文字颜色
    b_bs: *dark_c05 #退格键背景色
    t_bs: *dark_c02 #退格键文字颜色
    b_aoe: *dark_c03 #aoeiu背景色
    t_aoe: *dark_c07 #aoeiu文字颜色
    b_h0: *dark_c03 #键盘数字键背景色
    t_h0: *dark_c02 #键盘数字键数字颜色
    b_h1: *dark_c03 #键盘字母一行背景色
    t_h1: *dark_c02 #键盘字母一行文字颜色
    b_h2: *dark_c03 #键盘字母二行背景色
    t_h2: *dark_c02 #键盘字母二行文字颜色
    b_h3: *dark_c03 #键盘字母三行背景色
    t_h3: *dark_c02 #键盘字母三行文字颜色
    b_h4: *dark_c03 #键盘尾行背景色
    t_h4: *dark_c02 #键盘尾行文字颜色

