#patch:
#  "liquid_keyboard/=":
#    __include: "liquid_keyboard:/liquid_keyboard"

liquid_keyboard:
  # 目前只能直接写参数，不支持变量或者fallback机制。
  # 缺少参数时，自动从style中加载参数。除非需要指定liquid_keyboard使用与主键盘不同的背景色、背景图，否则不应设置被注释掉的参数。
  author: "tumuyan"
  row: 16              #每屏最多显示多少行按键
  row_land: 15         #横屏每屏最多显示多少行按键
  key_height: 40      #按键高度
  key_height_land: 40 #横屏模式按键高度
  single_width: *keyb_liquid_w    #single类型的按键宽度
  vertical_gap: 18     #纵向按键间隙
  margin_x: 1       #左右按键间隙的1/2
  keyboards: [tabs, history, cn, ascii, emoji_full, yanwenzi, fh, dn, xmsp, tq, yy, lx, bagua, xingzuolei, xh, fk, jh, jt, shuxue, szm, shuziyuanhudian, zimuyuanhu, shangxiabiao, xilazimu, eyu, yuefenriqi, sj, tiangandizhi, jq, dw, hb, zijiegou, zhuyinshengdiao, hanziyuanhu, shuzi, ladingzimu, riwen, hanwen]
  fixed_key_bar: # 固定按键条
    position: bottom  # 摆放位置（在滚动区域的……） top|bottom|left|right
    keys: # 按键（显示名称为对应的label，不能放太多）
      - liquid_keyboard_exit
      - liquid_keyboard_cn
      - liquid_keyboard_ascii
      #- space1
      - BackSpace1
      - Return1
      #- clipboard_window
      - liquid_keyboard_tabs
      #- liquid_keyboard_number
      #- liquid_Keyboard_editor
  tabs:
    name: 更多
    type: TABS
  history:
    name: 常用
    type: HISTORY
  cn:
    type: SINGLE
    name: "中标"
    keys: ["＿", "－", "—", "，", "、", "；", "：", "！", "？", "…", "。", "＇", "＂", "“", "”", "（", "）", "［", "］", "｛", "｝", "〈", "〉", "《", "》", "「", "」", "『", "』", "【", "】", "〔", "〕", "‖", "＠", "＊", "／", "＼", "＆", "＃", "％", "•", "｀", "＾", "＋", "＜", "＝", "＞", "｜", "～", "∩", "≦", "≧", "⊙", "▽", "◎", "々", "＄", "￡", "￥", "₩", "€", "０", "１", "２", "３", "４", "５", "６", "７", "８", "９", "〇", "零", "壹", "贰", "叁", "肆", "伍", "陆", "柒", "捌", "玖"]
